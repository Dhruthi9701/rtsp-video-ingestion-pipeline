services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"

  publisher:
    image: jrottenberg/ffmpeg:6.1-alpine
    depends_on:
      - mediamtx
    command: >
      -re -f lavfi -i testsrc2=size=1280x720:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -g 25
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/simcam
    restart: unless-stopped

  ingestor:
    build: .
    depends_on:
      - publisher
    environment:
      RTSP_URL: rtsp://mediamtx:8554/simcam
      CAMERA_NAME: simcam
    volumes:
      - ./output:/app/output
    command: ["run", "--config", "config/config.simulator.yaml", "--duration", "130"]
